<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Total Conquest — Conflict Registry</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080c10; --surface:#0d1620; --surface2:#111d2a; --border:#1a3045;
  --cyan:#00d4ff; --orange:#ff6b35; --green:#39ff14;
  --gold:#ffd700; --purple:#c084fc; --red:#ff3a3a; --yellow:#ffdd57;
  --text:#c8dde8; --text-dim:#4a6a7a;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;display:flex;flex-direction:column;}

header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);}

/* ── TOOLBAR (duplicate of header actions, shown when header is hidden by hub) ── */
.app-toolbar{display:none;flex-shrink:0;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;}
/* When hub hides header, toolbar becomes visible */
body:not(:has(header:not([style*="display:none"]))) .app-toolbar,
header[style*="display:none"] ~ .app-toolbar { display:flex; }
/* Simpler fallback: hub injects a class we can target */
body.hub-mode .app-toolbar{display:flex;}
.logo{font-family:'Orbitron',monospace;font-size:clamp(13px,2vw,18px);font-weight:900;letter-spacing:4px;color:var(--cyan);text-shadow:0 0 20px rgba(0,212,255,.5);}
.logo span{color:var(--orange);}
.header-sub{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--text-dim);}
.header-actions{display:flex;gap:8px;}

.app{flex:1;display:grid;grid-template-columns:290px 1fr;overflow:hidden;transition:grid-template-columns .3s cubic-bezier(0.4,0,0.2,1);}
.app.sidebar-collapsed{grid-template-columns:50px 1fr;}

.sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);overflow:hidden;}
.sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sidebar-header-content{flex:1;min-width:0;}
.sidebar-toggle{background:transparent;border:1px solid var(--border);color:var(--cyan);font-size:14px;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.sidebar-toggle:hover{border-color:var(--cyan);}
.sidebar-title{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;margin-bottom:10px;}
.search-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:12px;padding:8px 12px;outline:none;}
.search-input:focus{border-color:var(--cyan);}
.search-input::placeholder{color:var(--text-dim);}
.conflict-list{flex:1;overflow-y:auto;padding:8px;}
.conflict-list::-webkit-scrollbar{width:4px;}
.conflict-list::-webkit-scrollbar-thumb{background:var(--border);}
.sidebar-footer{flex-shrink:0;padding:12px;border-top:1px solid var(--border);}
.app.sidebar-collapsed .sidebar-header-content,
.app.sidebar-collapsed .conflict-list,
.app.sidebar-collapsed .sidebar-footer{display:none;}

.conflict-card{background:var(--surface2);border:1px solid var(--border);padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:all .2s;position:relative;}
.conflict-card:hover{border-color:rgba(0,212,255,.4);}
.conflict-card.active{border-color:var(--cyan);background:rgba(0,212,255,.05);}
.cc-name{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;color:var(--text);text-transform:uppercase;margin-bottom:6px;padding-right:22px;}
.status-badge{display:inline-block;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:2px;padding:2px 7px;border:1px solid;text-transform:uppercase;margin-bottom:6px;}
.s-ongoing{border-color:var(--green);color:var(--green);}
.s-ceasefire{border-color:var(--yellow);color:var(--yellow);}
.s-ended{border-color:var(--text-dim);color:var(--text-dim);}
.s-pending{border-color:var(--purple);color:var(--purple);}
.cc-vs{font-family:'Share Tech Mono',monospace;font-size:10px;margin-bottom:5px;line-height:1.5;}
.cc-vs .lv{color:var(--text-dim);}
.cc-stats{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);}
.cc-stats .dval{color:var(--red);} .cc-stats .tval{color:var(--cyan);}
.cc-dur{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--purple);margin-top:3px;}
.conflict-delete{position:absolute;top:8px;right:8px;background:transparent;border:1px solid transparent;color:var(--text-dim);font-size:11px;cursor:pointer;padding:2px 5px;transition:all .2s;}
.conflict-delete:hover,.conflict-delete.confirm{border-color:var(--red);color:var(--red);}

.editor{flex:1;overflow-y:auto;background:var(--bg);}
.editor::-webkit-scrollbar{width:6px;}
.editor::-webkit-scrollbar-thumb{background:var(--border);}
.no-selection{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;}
.no-selection-icon{font-size:60px;opacity:.25;}
.no-selection-text{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;}

.conflict-editor{padding:20px;display:flex;flex-direction:column;gap:14px;}

.ce-top{background:var(--surface);border:1px solid var(--border);padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
.ce-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.conflict-name-input{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;letter-spacing:3px;color:var(--text);background:transparent;border:none;border-bottom:1px solid var(--border);outline:none;flex:1;min-width:180px;padding:4px 0;text-transform:uppercase;}
.conflict-name-input:focus{border-bottom-color:var(--cyan);}
.status-select{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:11px;padding:6px 10px;outline:none;cursor:pointer;}
.status-select:focus{border-color:var(--cyan);}
.field-lbl{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:1px;white-space:nowrap;}
.date-input{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:11px;padding:6px 10px;outline:none;}
.date-input:focus{border-color:var(--cyan);}
.save-badge{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--green);letter-spacing:2px;display:none;}
.save-badge.show{display:inline-block;}
.desc-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:12px;padding:8px 12px;outline:none;resize:vertical;min-height:44px;max-height:90px;}
.desc-input:focus{border-color:var(--cyan);}
.desc-input::placeholder{color:var(--text-dim);}

.duration-box{display:flex;align-items:center;gap:14px;padding:9px 14px;background:rgba(192,132,252,.05);border:1px solid rgba(192,132,252,.2);}
.dur-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;}
.dur-val{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:var(--purple);}
.dur-days{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);}
.dur-seg{width:1px;height:18px;background:var(--border);}
.dur-live{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--green);letter-spacing:1px;}

/* ── DEATH COMPARISON ── */
.death-comparison{background:rgba(255,58,58,.04);border:1px solid rgba(255,58,58,.2);padding:14px 16px;}
.dc-title{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--red);text-transform:uppercase;margin-bottom:10px;}
.dc-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(26,48,69,.3);}
.dc-row:last-child{border-bottom:none;}
.dc-side-name{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dc-bar-wrap{flex:1;background:var(--bg);height:6px;border:1px solid rgba(26,48,69,.5);}
.dc-bar{height:100%;transition:width .4s;}
.dc-deaths{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--red);width:100px;flex-shrink:0;text-align:right;}
.dc-pct{font-size:9px;color:var(--text-dim);}
.dc-casualty-tag{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;padding:2px 6px;border:1px solid var(--red);color:var(--red);flex-shrink:0;white-space:nowrap;}

/* ── OBJECTIVES / WINNER PANEL ── */
.objectives-panel{background:rgba(255,215,0,.04);border:1px solid rgba(255,215,0,.2);padding:12px 16px;}
.op-title{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
.op-scores{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.op-side-score{font-family:'Share Tech Mono',monospace;font-size:11px;}
.op-sep{color:var(--text-dim);font-size:10px;}
.winner-badge{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;padding:4px 12px;border:1px solid var(--gold);color:var(--gold);background:rgba(255,215,0,.08);white-space:nowrap;}
.winner-badge.wbg-win{border-color:var(--green);color:var(--green);background:rgba(57,255,20,.08);}

/* ── SPLIT VIEW (vertical stack) ── */
.split-view{display:block;width:100%;}
.side{display:flex;flex-direction:column;width:100%;background:var(--surface);border:1px solid var(--border);}
.vs-divider{display:flex;flex-direction:row;align-items:center;justify-content:center;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);position:relative;height:36px;width:100%;}
.vs-divider::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(to right,transparent,var(--border) 20%,var(--border) 80%,transparent);}
.vs-label-text{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;letter-spacing:6px;color:var(--text-dim);writing-mode:horizontal-tb;z-index:1;}
.side-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.side-name-input{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:3px;background:transparent;border:none;border-bottom:1px solid transparent;outline:none;flex:1;padding:2px 0;text-transform:uppercase;}
.side-name-input:focus{border-bottom:1px solid currentColor;}
.side-badge{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;padding:2px 8px;border:1px solid;text-transform:uppercase;flex-shrink:0;}
.side-remove-btn{background:transparent;border:1px solid transparent;color:var(--text-dim);font-size:11px;cursor:pointer;padding:2px 6px;transition:all .2s;flex-shrink:0;}
.side-remove-btn:hover{border-color:var(--red);color:var(--red);}

.side-totals{border-bottom:1px solid var(--border);}
.totals-row{display:grid;}
.totals-row+.totals-row{border-top:1px solid rgba(26,48,69,.5);}
.totals-cas{grid-template-columns:repeat(3,1fr);}
.totals-hw{grid-template-columns:repeat(4,1fr);}
.total-cell{padding:8px 6px;text-align:center;border-right:1px solid rgba(26,48,69,.5);}
.total-cell:last-child{border-right:none;}
.total-cell-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin-bottom:3px;}
.total-cell-val{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;}
.tv-troops{color:var(--cyan);} .tv-injured{color:var(--yellow);} .tv-deaths{color:var(--red);}
.tv-tanks{color:#a78bfa;} .tv-vehicles{color:#6ee7b7;} .tv-aircrafts{color:#93c5fd;} .tv-warships{color:#67e8f9;}

.countries-area{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:visible;min-height:200px;}
.countries-area::-webkit-scrollbar{width:3px;}
.countries-area::-webkit-scrollbar-thumb{background:var(--border);}

/* ── COUNTRY CARD COLLAPSE ── */
.ccard-toggle-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:9px;cursor:pointer;padding:2px 6px;transition:all .2s;flex-shrink:0;font-family:'Share Tech Mono',monospace;letter-spacing:1px;}
.ccard-toggle-btn:hover{border-color:var(--cyan);color:var(--cyan);}
.ccard-body{transition:none;}
.empty-side{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-dim);text-align:center;padding:28px 0;}

/* ── OBJECTIVES AREA IN SIDE ── */
.objectives-area{border-top:1px solid var(--border);padding:10px;}
.obj-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.obj-title{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;}
.obj-count{font-family:'Orbitron',monospace;font-size:9px;}
.obj-list{display:flex;flex-direction:column;gap:2px;}
.obj-item{display:flex;align-items:flex-start;gap:6px;padding:4px 2px;border-bottom:1px solid rgba(26,48,69,.3);}
.obj-item:last-child{border-bottom:none;}
.obj-checkbox{cursor:pointer;accent-color:var(--green);width:14px;height:14px;flex-shrink:0;margin-top:2px;}
.obj-text{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text);flex:1;min-width:0;word-break:break-word;line-height:1.4;}
.obj-text.obj-done{text-decoration:line-through;color:var(--green);}
.obj-remove{background:transparent;border:1px solid transparent;color:var(--text-dim);font-size:10px;cursor:pointer;padding:1px 5px;flex-shrink:0;transition:all .15s;}
.obj-remove:hover{border-color:var(--red);color:var(--red);}
.obj-empty{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);padding:4px 0;font-style:italic;}

/* ── ADD SIDE BAR ── */
.add-side-bar{padding:10px 14px;border-top:1px solid var(--border);background:var(--surface);}

.ccard{background:var(--surface2);border:1px solid var(--border);overflow:hidden;}
.ccard-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(26,48,69,.6);}
.ccard-identity{display:flex;align-items:center;gap:8px;min-width:0;}
.ccard-flag{font-size:18px;flex-shrink:0;}
.ccard-name{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.role-badge{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;padding:2px 6px;border:1px solid;text-transform:uppercase;flex-shrink:0;}
.rb-main{border-color:var(--gold);color:var(--gold);}
.rb-ally{border-color:var(--text-dim);color:var(--text-dim);}
.ccard-actions{display:flex;gap:3px;flex-shrink:0;}
.icon-btn{background:transparent;border:1px solid transparent;color:var(--text-dim);font-size:11px;cursor:pointer;padding:2px 5px;transition:all .15s;font-family:'Share Tech Mono',monospace;}
.icon-btn:hover{border-color:var(--gold);color:var(--gold);}
.icon-btn.del:hover{border-color:var(--red);color:var(--red);}

.ccard-section{padding:6px 10px 8px;}
.ccard-section-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;padding:4px 0 6px;border-bottom:1px solid rgba(26,48,69,.4);margin-bottom:5px;}
.stat-row{display:flex;align-items:center;gap:4px;padding:2px 0;}
.stat-icon{font-size:11px;width:16px;text-align:center;flex-shrink:0;}
.stat-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-dim);width:58px;flex-shrink:0;letter-spacing:1px;}
.stat-ctrls{display:flex;align-items:center;gap:2px;flex:1;min-width:0;}
.dbtn{font-family:'Share Tech Mono',monospace;font-size:8px;padding:3px 4px;background:transparent;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:all .12s;white-space:nowrap;flex-shrink:0;}
.dbtn:hover{border-color:var(--cyan);color:var(--cyan);}
.dbtn.neg:hover{border-color:var(--orange);color:var(--orange);}
.stat-inp{font-family:'Share Tech Mono',monospace;font-size:12px;width:70px;background:var(--bg);border:1px solid var(--border);padding:3px 5px;text-align:center;outline:none;-moz-appearance:textfield;flex-shrink:0;}
.stat-inp::-webkit-inner-spin-button{-webkit-appearance:none;}
.stat-inp:focus{border-color:var(--cyan);}
.si-troops{color:var(--gold);} .si-injured{color:var(--yellow);} .si-deaths{color:var(--red);}
.si-tanks{color:#a78bfa;} .si-vehicles{color:#6ee7b7;} .si-aircrafts{color:#93c5fd;} .si-warships{color:#67e8f9;}
.si-hw-lost{color:var(--red);}

.hw-group{padding:4px 0 6px;border-bottom:1px solid rgba(26,48,69,.35);}
.hw-group:last-child{border-bottom:none;}
.hw-group-label{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--text-dim);padding:2px 0 4px;text-transform:uppercase;}
.hw-sub-row{display:flex;align-items:center;gap:4px;padding:2px 0;}
.hw-sub-tag{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;padding:2px 6px;border:1px solid;text-transform:uppercase;flex-shrink:0;width:46px;text-align:center;}
.in-war-tag{border-color:rgba(0,212,255,.3);color:var(--cyan);}
.lost-tag{border-color:rgba(255,58,58,.3);color:var(--red);}
.total-cell-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-dim);margin-top:2px;}
.tv-lost{color:var(--red);}

.side-foot{padding:10px;border-top:1px solid var(--border);}

.btn{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;padding:9px 16px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);cursor:pointer;text-transform:uppercase;transition:all .2s;white-space:nowrap;}
.btn:hover{background:var(--cyan);color:var(--bg);}
.btn-orange{border-color:var(--orange);color:var(--orange);}
.btn-orange:hover{background:var(--orange);color:var(--bg);}
.btn-green{border-color:var(--green);color:var(--green);}
.btn-green:hover{background:var(--green);color:var(--bg);}
.btn-red{border-color:var(--red);color:var(--red);}
.btn-red:hover{background:var(--red);color:var(--bg);}
.btn-full{width:100%;}
.btn-sm{padding:6px 12px;font-size:8px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border:1px solid var(--cyan);padding:28px;min-width:340px;max-width:480px;width:90%;}
.modal-title{font-family:'Orbitron',monospace;font-size:12px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.modal-field{margin-bottom:14px;}
.modal-label{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;}
.modal-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:14px;padding:10px 14px;outline:none;}
.modal-input:focus{border-color:var(--cyan);}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.toggle-row{display:flex;}
.toggle-opt{font-family:'Share Tech Mono',monospace;font-size:10px;padding:7px 16px;background:transparent;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:all .2s;}
.tom{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.06);}
.toly{border-color:var(--text-dim);color:var(--text-dim);}

/* ── COLLAPSE TOGGLE ── */
.collapse-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:11px;cursor:pointer;padding:2px 7px;transition:all .2s;flex-shrink:0;}
.collapse-btn:hover{border-color:var(--cyan);color:var(--cyan);}

/* ── KILLS SECTION ── */
.kills-section{border-top:1px solid var(--border);padding:10px;}
.kills-section-title{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--orange);text-transform:uppercase;margin-bottom:8px;}
.kill-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(26,48,69,.3);}
.kill-row:last-child{border-bottom:none;}
.kill-target-name{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kill-input{font-family:'Share Tech Mono',monospace;font-size:12px;width:90px;background:var(--bg);border:1px solid rgba(255,107,53,.3);color:var(--orange);padding:3px 6px;text-align:center;outline:none;-moz-appearance:textfield;flex-shrink:0;}

.ac-name{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;color:var(--text);text-transform:uppercase;margin-bottom:8px;}
.ac-status{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--text-dim);margin-bottom:10px;}
.ac-sides-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}

.ac-side-bar-wrap{flex:1;background:var(--bg);height:8px;border:1px solid rgba(26,48,69,.5);}

.no-conflicts{text-align:center;padding:20px;color:var(--text-dim);font-family:'Share Tech Mono',monospace;font-size:11px;}
</style>
</head>
<body>

  <div>
    <div class="logo">TOTAL <span>CONQUEST</span></div>

<script>
// =====================================================
// SIDE COLORS (index-based)
// =====================================================
const SIDE_COLORS      = ['#00d4ff','#ff6b35','#39ff14','#c084fc','#ffd700','#ffdd57','#f87171','#60a5fa'];
const SIDE_BORDER_RGBA = ['rgba(0,212,255,.3)','rgba(255,107,53,.3)','rgba(57,255,20,.3)','rgba(192,132,252,.3)','rgba(255,215,0,.3)','rgba(255,221,87,.3)','rgba(248,113,113,.3)','rgba(96,165,250,.3)'];
const SIDE_NAMES_DEF   = ['Side Alpha','Side Bravo','Side Charlie','Side Delta','Side Echo','Side Foxtrot','Side Golf','Side Hotel'];

// =====================================================
// GAME DATE (in-game current date for duration calc)
// =====================================================
let gameDate = localStorage.getItem('tc_game_date') || '';

function getGameNow(){
  if(gameDate){
    const d = new Date(gameDate);
    if(!isNaN(d)) return d;
  }
  return new Date();
}

function setGameDate(val){
  const parsed = parseDate(val);
  gameDate = parsed;
  localStorage.setItem('tc_game_date', parsed);
  const inp = document.getElementById('game-date-input');
  if(inp && parsed) inp.value = displayDate(parsed);
  const inpTb = document.getElementById('game-date-input-tb');
  if(inpTb && parsed) inpTb.value = displayDate(parsed);
  renderList();
  if(selectedId) renderEditor();
}

// =====================================================
// STATE
// =====================================================
const STORAGE_KEY = 'tc_conflicts';
let conflicts = [], selectedId = null, deletePending = {}, sidebarCollapsed = false;
let _cmConflictId = null, _cmSideId = null, _cmRole = 'main';
let collapsedSides = {}, collapsedCountries = {};

// =====================================================
// UTILS
// =====================================================
function uuid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function fmt(n){ return Number(n||0).toLocaleString('en-US'); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function calcDuration(startDate, endDate, status){
  if(!startDate) return null;
  const start = new Date(startDate);
  if(isNaN(start)) return null;
  const useEnd = (status==='ended'&&endDate) ? new Date(endDate) : getGameNow();
  if(isNaN(useEnd)||useEnd<start) return null;
  const totalDays = Math.floor((useEnd-start)/86400000);
  const years  = Math.floor(totalDays/365);
  const months = Math.floor((totalDays%365)/30);
  const days   = totalDays%30;
  const parts  = [];
  if(years>0)  parts.push(`${years}y`);
  if(months>0) parts.push(`${months}mo`);
  parts.push(`${days}d`);
  return { label:parts.join(' '), totalDays };
}

function parseDate(str){
  if(!str) return '';
  str=str.trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  const m1=str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m1) return `${m1[3]}-${m1[1].padStart(2,'0')}-${m1[2].padStart(2,'0')}`;
  const m2=str.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m2) return `${m2[3]}-${m2[1].padStart(2,'0')}-${m2[2].padStart(2,'0')}`;
  return '';
}
function displayDate(yyyymmdd){
  if(!yyyymmdd) return '';
  const m=yyyymmdd.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return `${m[2]}/${m[3]}/${m[1]}`;
  return yyyymmdd;
}

// =====================================================
// FACTORY
// =====================================================
function makeSide(name){
  return { id:uuid(), name:name||'New Side', countries:[], objectives:[], kills:{} };
}
function makeConflict(name){
  return { id:uuid(), name:name||'New Conflict', status:'ongoing', description:'',
    startDate:new Date().toISOString().slice(0,10), endDate:'', createdAt:Date.now(),
    sides:[ makeSide('Side Alpha'), makeSide('Side Bravo') ] };
}
function makeCountry(name,flag,isMain){
  return { id:uuid(), name:name||'Unknown', flag:flag||'🏴', isMain:!!isMain,
    troops:0, injured:0, deaths:0,
    tanks:0,    tanks_lost:0,
    vehicles:0, vehicles_lost:0,
    aircrafts:0,aircrafts_lost:0,
    warships:0, warships_lost:0 };
}
function makeObjective(text){
  return { id:uuid(), text:text||'', checked:false };
}

// =====================================================
// HELPERS
// =====================================================
function getSide(c, sideId){
  return (c.sides||[]).find(s=>s.id===sideId)||null;
}
function getSideIdx(c, sideId){
  return (c.sides||[]).findIndex(s=>s.id===sideId);
}

// =====================================================
// STORAGE & HYDRATION
// =====================================================
function hydrateSide(side){
  if(!side.id) side.id = uuid();
  if(!side.objectives) side.objectives = [];
  if(!side.countries) side.countries = [];
  if(!side.kills) side.kills = {};
  side.countries.forEach(co=>{
    ['tanks','vehicles','aircrafts','warships'].forEach(f=>{
      if(co[f]===undefined) co[f]=0;
      if(co[f+'_lost']===undefined) co[f+'_lost']=0;
    });
  });
}
function hydrateConflict(c){
  // Migrate old sideA/sideB format
  if(!c.sides){
    c.sides = [];
    if(c.sideA){ c.sideA.id=c.sideA.id||uuid(); c.sides.push(c.sideA); delete c.sideA; }
    else { c.sides.push(makeSide('Side Alpha')); }
    if(c.sideB){ c.sideB.id=c.sideB.id||uuid(); c.sides.push(c.sideB); delete c.sideB; }
    else { c.sides.push(makeSide('Side Bravo')); }
  }
  c.sides.forEach(hydrateSide);
  if(c.endDate===undefined) c.endDate='';
}

function load(){
  try{ conflicts=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }catch(e){ conflicts=[]; }
  conflicts.forEach(hydrateConflict);
}
function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(conflicts)); }
function getConflict(id){ return conflicts.find(c=>c.id===id)||null; }

// =====================================================
// SIDEBAR
// =====================================================
function toggleSidebar(){
  sidebarCollapsed=!sidebarCollapsed;
  document.getElementById('app').classList.toggle('sidebar-collapsed',sidebarCollapsed);
  document.getElementById('stoggle').textContent=sidebarCollapsed?'←':'→';
}

function renderList(){
  const q=document.getElementById('search').value.toLowerCase();
  const el=document.getElementById('conflict-list');
  const filtered=conflicts.filter(c=>c.name.toLowerCase().includes(q));
  if(!filtered.length){
    el.innerHTML=`<div style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-dim);text-align:center;padding:30px;">No conflicts found</div>`;
    return;
  }
  el.innerHTML=filtered.map(c=>{
    const allCos = (c.sides||[]).flatMap(s=>s.countries);
    const totalDeaths = allCos.reduce((s,x)=>s+(x.deaths||0),0);
    const totalTroops = allCos.reduce((s,x)=>s+(x.troops||0),0);
    const sidesLabel = (c.sides||[]).map((side,i)=>{
      const main = side.countries.find(x=>x.isMain);
      const col  = SIDE_COLORS[i]||'var(--text-dim)';
      const extra = side.countries.length>1?` <span style="color:var(--text-dim);">+${side.countries.length-1}</span>`:'';
      if(main) return `<span style="color:${col};">${main.flag} ${esc(main.name)}</span>${extra}`;
      return `<span style="color:var(--text-dim);">???</span>`;
    }).join(' <span style="color:var(--text-dim);">vs</span> ');
    const dur=calcDuration(c.startDate,c.endDate,c.status);
    const durHtml=dur?`<div class="cc-dur">⏱ ${dur.label} · ${fmt(dur.totalDays)} days</div>`:'';
    // Objectives summary
    const totalObj = (c.sides||[]).reduce((s,side)=>s+side.objectives.length,0);
    const doneObj  = (c.sides||[]).reduce((s,side)=>s+side.objectives.filter(o=>o.checked).length,0);
    const objHtml  = totalObj>0?`<div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--gold);margin-top:3px;">⚑ ${doneObj}/${totalObj} objectives</div>`:'';
    return `<div class="conflict-card ${selectedId===c.id?'active':''}" onclick="selectConflict('${c.id}')">
      <button class="conflict-delete ${deletePending[c.id]?'confirm':''}" onclick="deleteConflict(event,'${c.id}')">${deletePending[c.id]?'✓':'×'}</button>
      <div class="cc-name">${esc(c.name)}</div>
      <div><span class="status-badge s-${c.status}">${c.status}</span></div>
      <div class="cc-vs">${sidesLabel}</div>
      <div class="cc-stats">⚔️ <span class="tval">${fmt(totalTroops)}</span> &nbsp;·&nbsp; 💀 <span class="dval">${fmt(totalDeaths)}</span></div>
      ${objHtml}
      ${durHtml}
    </div>`;
  }).join('');
}

// =====================================================
// EDITOR
// =====================================================
function selectConflict(id){ selectedId=id; renderList(); renderEditor(); }

let saveTimer=null;
function flashSaved(){
  const b=document.getElementById('save-badge');
  if(!b) return;
  b.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>b.classList.remove('show'),1500);
}

function renderEditor(){
  const editor=document.getElementById('editor');
  const c=getConflict(selectedId);
  if(!c){
    editor.innerHTML=`<div class="no-selection"><div class="no-selection-icon">⚔️</div><div class="no-selection-text">Select or create a conflict</div></div>`;
    return;
  }
  const statOpts=['ongoing','ceasefire','ended','pending']
    .map(s=>`<option value="${s}" ${c.status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
  const dur=calcDuration(c.startDate,c.endDate,c.status);
  const durHtml=dur?`<div class="duration-box">
    <span class="dur-lbl">Duration</span>
    <span class="dur-val">${dur.label}</span>
    <span class="dur-seg"></span>
    <span class="dur-days">${fmt(dur.totalDays)} days total</span>
    ${c.status!=='ended'?`<span class="dur-seg"></span><span class="dur-live">● LIVE</span>`:''}
  </div>`:'';
  const endDateHtml=c.status==='ended'?`
    <span class="field-lbl">End Date:</span>
    <input class="date-input" type="text" placeholder="MM/DD/YYYY" value="${esc(displayDate(c.endDate||''))}"
      onchange="updateConflict('${c.id}','endDate',parseDate(this.value))">
  `:'';

  // Build sides HTML
  const sidesHtml = (c.sides||[]).map((side,idx)=>{
    const vsDiv = idx>0 ? `<div class="vs-divider"><span class="vs-label-text">VS</span></div>` : '';
    return vsDiv + renderSide(c, side, idx);
  }).join('');

  editor.innerHTML=`<div class="conflict-editor">
    <div class="ce-top">
      <div class="ce-row">
        <input class="conflict-name-input" value="${esc(c.name)}" placeholder="CONFLICT NAME"
          onchange="updateConflict('${c.id}','name',this.value)">
        <select class="status-select" onchange="updateConflict('${c.id}','status',this.value)">${statOpts}</select>
        <span class="save-badge" id="save-badge">✓ SAVED</span>
      </div>
      <div class="ce-row">
        <span class="field-lbl">Start Date:</span>
        <input class="date-input" type="text" placeholder="MM/DD/YYYY" value="${esc(displayDate(c.startDate||''))}"
          onchange="updateConflict('${c.id}','startDate',parseDate(this.value))">
        ${endDateHtml}
      </div>
      ${durHtml}
      <textarea class="desc-input" placeholder="Description / notes…"
        onchange="updateConflict('${c.id}','description',this.value)">${esc(c.description||'')}</textarea>
    </div>
    <div id="death-comparison-${c.id}">${renderDeathComparisonHTML(c)}</div>
    <div id="winner-panel-${c.id}">${renderWinnerPanelHTML(c)}</div>
    <div class="split-view">
        ${sidesHtml}
      </div>
    <div class="add-side-bar">
      <button class="btn btn-sm btn-green" onclick="addSide('${c.id}')">+ ADD SIDE</button>
    </div>
  </div>`;
}

// =====================================================
// DEATH COMPARISON
// =====================================================
function renderDeathComparisonHTML(c){
  const sideDeaths = (c.sides||[]).map((side,i)=>({
    name: side.name,
    deaths: sideTotals(side).deaths,
    idx: i
  }));
  const totalDeaths = sideDeaths.reduce((s,x)=>s+x.deaths,0);
  if(totalDeaths===0) return '';
  const maxDeaths = Math.max(...sideDeaths.map(s=>s.deaths));
  return `<div class="death-comparison">
    <div class="dc-title">💀 Casualties Comparison</div>
    ${sideDeaths.map(s=>{
      const pct = totalDeaths>0 ? (s.deaths/totalDeaths*100) : 0;
      const isWorst = s.deaths===maxDeaths && s.deaths>0;
      const col = SIDE_COLORS[s.idx]||'var(--text-dim)';
      return `<div class="dc-row">
        <div class="dc-side-name" style="color:${col};">${esc(s.name)}</div>
        <div class="dc-bar-wrap"><div class="dc-bar" style="width:${pct.toFixed(1)}%;background:${isWorst?'var(--red)':col};"></div></div>
        <div class="dc-deaths">${fmt(s.deaths)} <span class="dc-pct">${pct.toFixed(1)}%</span></div>
        ${isWorst?'<div class="dc-casualty-tag">▲ HIGHEST</div>':''}
      </div>`;
    }).join('')}
  </div>`;
}

// =====================================================
// WINNER PANEL (Objectives)
// =====================================================
function renderWinnerPanelHTML(c){
  const anyObjs = (c.sides||[]).some(s=>s.objectives.length>0);
  if(!anyObjs) return '';

  const sideScores = (c.sides||[]).map((side,i)=>({
    name: side.name,
    done: side.objectives.filter(o=>o.checked).length,
    total: side.objectives.length,
    idx: i
  }));

  const maxDone = Math.max(...sideScores.map(s=>s.done));
  const leaders = sideScores.filter(s=>s.done===maxDone && maxDone>0);
  let winHtml = '';
  if(leaders.length===1){
    const label = c.status==='ended'?'🏆 WINNER':'⚑ LEADING';
    winHtml = `<span class="winner-badge ${c.status==='ended'?'wbg-win':''}">${label}: ${esc(leaders[0].name)}</span>`;
  } else if(leaders.length>1 && maxDone>0){
    winHtml = `<span class="winner-badge">⚖️ TIED: ${leaders.map(l=>esc(l.name)).join(' & ')}</span>`;
  }

  const scoresHtml = sideScores.map((s,i)=>{
    const col = SIDE_COLORS[s.idx]||'var(--text)';
    const doneCol = s.done>0?'var(--green)':'var(--text-dim)';
    return `<span class="op-side-score"><span style="color:${col};">${esc(s.name)}</span><span style="color:var(--text-dim);"> — </span><span style="color:${doneCol};font-family:'Orbitron',monospace;font-size:10px;">${s.done}/${s.total}</span></span>`;
  }).join('<span class="op-sep"> · </span>');

  return `<div class="objectives-panel">
    <div class="op-title">⚑ Objectives Progress</div>
    <div class="op-scores">${scoresHtml}${winHtml?`<span class="op-sep">·</span>${winHtml}`:''}</div>
  </div>`;
}

// =====================================================
// SIDE RENDER
// =====================================================
function sideTotals(side){
  return side.countries.reduce((acc,co)=>{
    acc.troops         +=(co.troops        ||0);
    acc.injured        +=(co.injured       ||0);
    acc.deaths         +=(co.deaths        ||0);
    acc.tanks          +=(co.tanks         ||0);
    acc.tanks_lost     +=(co.tanks_lost    ||0);
    acc.vehicles       +=(co.vehicles      ||0);
    acc.vehicles_lost  +=(co.vehicles_lost ||0);
    acc.aircrafts      +=(co.aircrafts     ||0);
    acc.aircrafts_lost +=(co.aircrafts_lost||0);
    acc.warships       +=(co.warships      ||0);
    acc.warships_lost  +=(co.warships_lost ||0);
    return acc;
  },{troops:0,injured:0,deaths:0,tanks:0,tanks_lost:0,vehicles:0,vehicles_lost:0,aircrafts:0,aircrafts_lost:0,warships:0,warships_lost:0});
}

function renderTotalsHTML(t){
  const hwCell=(icon,lbl,inWarCls,inWar,lost)=>`<div class="total-cell">
    <div class="total-cell-lbl">${icon} ${lbl}</div>
    <div class="total-cell-val ${inWarCls}">${fmt(inWar)}</div>
    <div class="total-cell-sub">▼ <span class="tv-lost">${fmt(lost)}</span> lost</div>
  </div>`;
  return `<div class="totals-row totals-cas">
    <div class="total-cell"><div class="total-cell-lbl">⚔️ Troops</div><div class="total-cell-val tv-troops">${fmt(t.troops)}</div></div>
    <div class="total-cell"><div class="total-cell-lbl">🩹 Injured</div><div class="total-cell-val tv-injured">${fmt(t.injured)}</div></div>
    <div class="total-cell"><div class="total-cell-lbl">💀 Deaths</div><div class="total-cell-val tv-deaths">${fmt(t.deaths)}</div></div>
  </div>
  <div class="totals-row totals-hw">
    ${hwCell('🛡️','Tanks',    'tv-tanks',    t.tanks,    t.tanks_lost)}
    ${hwCell('🚗','Vehicles', 'tv-vehicles', t.vehicles, t.vehicles_lost)}
    ${hwCell('✈️','Aircrafts','tv-aircrafts',t.aircrafts,t.aircrafts_lost)}
    ${hwCell('⚓','Warships', 'tv-warships', t.warships, t.warships_lost)}
  </div>`;
}

function renderObjectivesHTML(cid, sideId, objectives){
  const done = objectives.filter(o=>o.checked).length;
  const total = objectives.length;
  const doneCol = done>0?'var(--green)':'var(--text-dim)';
  const listHtml = total===0
    ? `<div class="obj-empty">No objectives set.</div>`
    : objectives.map(obj=>`<div class="obj-item">
        <input type="checkbox" class="obj-checkbox" ${obj.checked?'checked':''} onchange="toggleObjective('${cid}','${sideId}','${obj.id}')">
        <span class="obj-text ${obj.checked?'obj-done':''}">${esc(obj.text)}</span>
        <button class="obj-remove" onclick="removeObjective('${cid}','${sideId}','${obj.id}')">×</button>
      </div>`).join('');
  return `<div class="obj-header">
    <span class="obj-title">⚑ Objectives</span>
    <span style="display:flex;align-items:center;gap:6px;">
      <span class="obj-count" style="color:${doneCol};">${done}/${total}</span>
      <button class="btn btn-sm" style="padding:3px 8px;font-size:8px;" onclick="addObjective('${cid}','${sideId}')">+ Add</button>
    </span>
  </div>
  <div class="obj-list">${listHtml}</div>`;
}

function renderSide(c, side, idx){
  const color = SIDE_COLORS[idx]||'#c8dde8';
  const borderCol = SIDE_BORDER_RGBA[idx]||'rgba(200,221,232,.2)';
  const t=sideTotals(side);
  const isCollapsed = !!collapsedSides[side.id];
  const empty=!side.countries.length?`<div class="empty-side">No countries yet.<br>Click below to add one.</div>`:'';
  const canRemove = (c.sides||[]).length>2;
  return `<div class="side" style="border-color:${borderCol};">
    <div class="side-header">
      <input class="side-name-input" style="color:${color};" value="${esc(side.name)}" placeholder="Side Name"
        onchange="updateSideName('${c.id}','${side.id}',this.value)">
      <span class="side-badge" style="border-color:${borderCol};color:${color};">SIDE ${idx+1}</span>
      <button class="collapse-btn" id="collapse-btn-${side.id}" onclick="toggleSideCollapse('${side.id}')"
        >${isCollapsed?'▶ Show Members':'▼ Hide Members'}</button>
      ${canRemove?`<button class="side-remove-btn" title="Remove side" onclick="removeSide('${c.id}','${side.id}')">✕</button>`:''}
    </div>
    <div class="side-totals" id="totals-${side.id}-${c.id}">${renderTotalsHTML(t)}</div>
    <div id="countries-collapse-${side.id}" style="${isCollapsed?'display:none;':''}">
      <div class="countries-area">
        ${empty}
        ${side.countries.map(co=>renderCountryCard(c.id,side.id,co)).join('')}
      </div>
      <div class="objectives-area" id="objectives-${side.id}">
        ${renderObjectivesHTML(c.id, side.id, side.objectives)}
      </div>
      <div class="side-foot">
        <button class="btn btn-sm btn-full" style="border-color:${color};color:${color};"
          onclick="openAddCountryModal('${c.id}','${side.id}')">+ ADD COUNTRY</button>

    </div>

}

function statCtrls(cid,sideId,co,stat,steps,cls){
  const val=co[stat]||0;
  const negs=steps.filter(x=>x<0);
  const poss=steps.filter(x=>x>0);
  const negBtns=negs.map(n=>`<button class="dbtn neg" onclick="deltaStat('${cid}','${sideId}','${co.id}','${stat}',${n})">${n}</button>`).join('');
  const posBtns=poss.map(n=>`<button class="dbtn" onclick="deltaStat('${cid}','${sideId}','${co.id}','${stat}',${n})">+${n}</button>`).join('');
  return `<div class="stat-ctrls">
    ${negBtns}
    <input class="stat-inp ${cls}" type="number" value="${val}" min="0"
      data-cid="${cid}" data-side="${sideId}" data-co="${co.id}" data-stat="${stat}"
      oninput="setStat(this)" onchange="setStat(this)">
    ${posBtns}
  </div>`;
}

function statRow(cid,sideId,co,stat,icon,label,steps,cls){
  const val=co[stat]||0;
  const negs=steps.filter(x=>x<0);
  const poss=steps.filter(x=>x>0);
  const negBtns=negs.map(n=>`<button class="dbtn neg" onclick="deltaStat('${cid}','${sideId}','${co.id}','${stat}',${n})">${n}</button>`).join('');
  const posBtns=poss.map(n=>`<button class="dbtn" onclick="deltaStat('${cid}','${sideId}','${co.id}','${stat}',${n})">+${n}</button>`).join('');
  return `<div class="stat-row">
    <span class="stat-icon">${icon}</span>
    <span class="stat-lbl">${label}</span>
    <div class="stat-ctrls">
      ${negBtns}
      <input class="stat-inp ${cls}" type="number" value="${val}" min="0"
        data-cid="${cid}" data-side="${sideId}" data-co="${co.id}" data-stat="${stat}"
        oninput="setStat(this)" onchange="setStat(this)">
      ${posBtns}
    </div>
  </div>`;
}

// =====================================================
// KILLS TRACKING
// =====================================================
function renderKillsHTML(c, side){
  const otherSides = (c.sides||[]).filter(s=>s.id!==side.id);
  if(otherSides.length===0) return '';
  if(!side.kills) side.kills={};
  const totalKills = otherSides.reduce((s,t)=>s+(side.kills[t.id]||0),0);
  const rows = otherSides.map(target=>{
    const targetIdx = (c.sides||[]).indexOf(target);
    const col = SIDE_COLORS[targetIdx]||'var(--text-dim)';
    const val = side.kills[target.id]||0;
    return `<div class="kill-row">
      <span class="kill-target-name" style="color:${col};">vs ${esc(target.name)}</span>
      <input class="kill-input" type="number" value="${val}" min="0"
        data-cid="${c.id}" data-side="${side.id}" data-target="${target.id}"
        oninput="setKill(this)" onchange="setKill(this)">
      <span style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-dim);">kills</span>
    </div>`;
  }).join('');
  return `<div class="kills-section">
    <div class="kills-section-title">💀 Kills Inflicted &nbsp;<span style="color:var(--orange);font-size:10px;">${fmt(totalKills)} total</span></div>
    ${rows}
  </div>`;
}

function setKill(inputEl){
  const cid=inputEl.dataset.cid, sideId=inputEl.dataset.side, targetId=inputEl.dataset.target;
  const c=getConflict(cid); if(!c) return;
  const side=getSide(c,sideId); if(!side) return;
  if(!side.kills) side.kills={};
  const val=Math.max(0,parseInt(inputEl.value)||0);
  side.kills[targetId]=val;
  inputEl.value=val;
  save(); flashSaved();
  renderList();
}

function toggleSideCollapse(sideId){
  collapsedSides[sideId]=!collapsedSides[sideId];
  const area=document.getElementById(`countries-collapse-${sideId}`);
  if(area) area.style.display=collapsedSides[sideId]?'none':'';
  const btn=document.getElementById(`collapse-btn-${sideId}`);
  if(btn){
    btn.textContent=collapsedSides[sideId]?'▶ Show Members':'▼ Hide Members';
  }
}

function toggleCountryCard(coId){
  collapsedCountries[coId]=!collapsedCountries[coId];
  const body=document.getElementById(`ccard-body-${coId}`);
  if(body) body.style.display=collapsedCountries[coId]?'none':'';
  const btn=document.getElementById(`ccard-toggle-${coId}`);
  if(btn) btn.textContent=collapsedCountries[coId]?'▶ EXPAND':'▼ HIDE';
}

// =====================================================
// DATA MUTATIONS
// =====================================================
function updateConflict(id,key,val){
  const c=getConflict(id); if(!c) return;
  c[key]=val; save(); flashSaved(); renderList();
  if(key==='status'||key==='startDate'||key==='endDate') renderEditor();
}

function updateSideName(id,sideId,val){
  const c=getConflict(id); if(!c) return;
  const side=getSide(c,sideId); if(!side) return;
  side.name=val; save(); flashSaved(); renderList();
  refreshWinnerPanel(id);
  refreshDeathComparison(id);
}

function setStat(inputEl){
  const cid=inputEl.dataset.cid, sideId=inputEl.dataset.side,
        coId=inputEl.dataset.co, stat=inputEl.dataset.stat;
  const c=getConflict(cid); if(!c) return;
  const side=getSide(c,sideId); if(!side) return;
  const co=side.countries.find(x=>x.id===coId); if(!co) return;
  const parsed=parseFloat(inputEl.value);
  co[stat]=isNaN(parsed)?0:Math.max(0,parsed);
  save(); flashSaved();
  refreshTotals(cid,sideId);
  refreshDeathComparison(cid);
  renderList();
}

function deltaStat(cid,sideId,coId,stat,amount){
  const c=getConflict(cid); if(!c) return;
  const side=getSide(c,sideId); if(!side) return;
  const co=side.countries.find(x=>x.id===coId); if(!co) return;
  co[stat]=Math.max(0,(co[stat]||0)+amount);
  save(); flashSaved();
  const inp=document.querySelector(`.stat-inp[data-cid="${cid}"][data-side="${sideId}"][data-co="${coId}"][data-stat="${stat}"]`);
  if(inp) inp.value=co[stat];
  refreshTotals(cid,sideId);
  refreshDeathComparison(cid);
  renderList();
}

function refreshTotals(cid,sideId){
  const c=getConflict(cid); if(!c) return;
  const side=getSide(c,sideId); if(!side) return;
  const el=document.getElementById(`totals-${sideId}-${cid}`);
  if(!el) return;
  el.innerHTML=renderTotalsHTML(sideTotals(side));
}

function refreshDeathComparison(cid){
  const c=getConflict(cid); if(!c) return;
  const el=document.getElementById(`death-comparison-${cid}`);
  if(!el) return;
  el.innerHTML=renderDeathComparisonHTML(c);
}

function refreshWinnerPanel(cid){
  const c=getConflict(cid); if(!c) return;
  const el=document.getElementById(`winner-panel-${cid}`);
  if(!el) return;
  el.innerHTML=renderWinnerPanelHTML(c);
}

function refreshObjectives(cid,sideId){
  const c=getConflict(cid); if(!c) return;
  const side=getSide(c,sideId); if(!side) return;
  const el=document.getElementById(`objectives-${sideId}`);
  if(!el) return;
  el.innerHTML=renderObjectivesHTML(cid, sideId, side.objectives);
}

function toggleRole(cid,sideId,coId){
  const c=getConflict(cid); if(!c) return;
  const side=getSide(c,sideId); if(!side) return;
  const co=side.countries.find(x=>x.id===coId); if(!co) return;
  co.isMain=!co.isMain; save(); flashSaved();
  const card=document.querySelector(`.ccard[data-co="${coId}"]`);
  if(card){
    const badge=card.querySelector('.role-badge');
    if(badge){ badge.className='role-badge '+(co.isMain?'rb-main':'rb-ally'); badge.textContent=co.isMain?'★ MAIN':'◇ ALLY'; }
  }
  renderList();
}

function removeCountry(cid,sideId,coId){
  const c=getConflict(cid); if(!c) return;
  const side=getSide(c,sideId); if(!side) return;
  side.countries=side.countries.filter(x=>x.id!==coId);
  save(); flashSaved(); renderEditor(); renderList();
  toast('Country removed.');
}

// ── SIDE MANAGEMENT ──
function addSide(cid){
  const c=getConflict(cid); if(!c) return;
  const idx=c.sides.length;
  c.sides.push(makeSide(SIDE_NAMES_DEF[idx]||`Side ${idx+1}`));
  save(); renderEditor(); renderList();
  toast('New side added!');
}

function removeSide(cid,sideId){
  const c=getConflict(cid); if(!c) return;
  if(c.sides.length<=2){ toast('Conflicts must have at least 2 sides.'); return; }
  c.sides=c.sides.filter(s=>s.id!==sideId);
  save(); renderEditor(); renderList();
  toast('Side removed.');
}

// ── OBJECTIVES ──
function addObjective(cid,sideId){
  const text=prompt('Enter objective:');
  if(!text||!text.trim()) return;
  const c=getConflict(cid); if(!c) return;
  const side=getSide(c,sideId); if(!side) return;
  side.objectives.push(makeObjective(text.trim()));
  save();
  refreshObjectives(cid,sideId);
  refreshWinnerPanel(cid);
  renderList();
  toast('Objective added!');
}

function toggleObjective(cid,sideId,objId){
  const c=getConflict(cid); if(!c) return;
  const side=getSide(c,sideId); if(!side) return;
  const obj=side.objectives.find(o=>o.id===objId); if(!obj) return;
  obj.checked=!obj.checked;
  save();
  refreshObjectives(cid,sideId);
  refreshWinnerPanel(cid);
  renderList();
}

function removeObjective(cid,sideId,objId){
  const c=getConflict(cid); if(!c) return;
  const side=getSide(c,sideId); if(!side) return;
  side.objectives=side.objectives.filter(o=>o.id!==objId);
  save();
  refreshObjectives(cid,sideId);
  refreshWinnerPanel(cid);
  renderList();
  toast('Objective removed.');
}

function deleteConflict(e,id){
  e.stopPropagation();
  if(deletePending[id]){
    conflicts=conflicts.filter(c=>c.id!==id);
    delete deletePending[id];
    if(selectedId===id){ selectedId=null; renderEditor(); }
    save(); renderList(); toast('Conflict deleted.');
  } else {
    deletePending[id]=true; renderList();
    setTimeout(()=>{ delete deletePending[id]; renderList(); },3000);
  }
}

function closeModal(id){ document.getElementById(id).classList.remove('open'); }

// =====================================================
// IMPORT / EXPORT
// =====================================================
function exportJSON(){
  const blob=new Blob([JSON.stringify(conflicts,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`conflicts.json`; a.click();
  toast('Exported!');
}
function importJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error();
      data.forEach(hydrateConflict);
      conflicts=data; save(); renderList();
      if(selectedId&&!getConflict(selectedId)){ selectedId=null; renderEditor(); }
      toast(`Imported ${data.length} conflict(s).`);
    }catch{ toast('Invalid JSON.'); }
  };
  reader.readAsText(file); e.target.value='';
}

function toast(msg,dur=2500){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}

// =====================================================
// ANALYSIS MODAL (N-sided combat power)
// =====================================================
function calculateSideScores(conflict){
  const scores = (conflict.sides||[]).map((side,idx)=>{
    const cos = side.countries;
    const troops     = cos.reduce((s,c)=>s+(c.troops     ||0),0);
    const deaths     = cos.reduce((s,c)=>s+(c.deaths     ||0),0);
    const equip      = cos.reduce((s,c)=>s+(c.tanks||0)+(c.vehicles||0)+(c.aircrafts||0)+(c.warships||0),0);
    const equipLost  = cos.reduce((s,c)=>s+(c.tanks_lost||0)+(c.vehicles_lost||0)+(c.aircrafts_lost||0)+(c.warships_lost||0),0);
    const objDone    = side.objectives.filter(o=>o.checked).length;
    const objTotal   = side.objectives.length;
    return { name:side.name, troops, deaths, equip, equipLost, objDone, objTotal, cos:cos.length, idx };
  });

  const totalTroops = scores.reduce((s,x)=>s+x.troops,0)||1;
  const totalDeaths = scores.reduce((s,x)=>s+x.deaths,0)||1;
  const totalEquip  = scores.reduce((s,x)=>s+x.equip, 0)||1;
  const n = scores.length||1;

  scores.forEach(s=>{
    const troopScore   = (s.troops/totalTroops)*35;
    const equipScore   = (s.equip/totalEquip)*30;
    const survivalRate = s.equip>0 ? s.equip/(s.equip+s.equipLost) : 0.5;
    const deathScore   = (1-(s.deaths/totalDeaths))*(20/Math.max(n-1,1));
    s.rawScore = troopScore + equipScore + survivalRate*10 + deathScore + (35/n);
  });

  const totalRaw = scores.reduce((s,x)=>s+x.rawScore,0)||1;
  scores.forEach(s=>{ s.pct=Math.round((s.rawScore/totalRaw)*100); });
  // Normalize rounding
  const diff = 100 - scores.reduce((s,x)=>s+x.pct,0);
  if(scores.length>0) scores[0].pct+=diff;

  return scores;
}

function openAnalysisModal(){
  const content=document.getElementById('analysis-content');
  if(conflicts.length===0){
    content.innerHTML='<div class="no-conflicts">No conflicts registered yet.</div>';
    document.getElementById('analysis-modal').classList.add('open');
    return;
  }
  const statusMap={'ongoing':'🔴 Ongoing','ceasefire':'🟡 Ceasefire','ended':'⚪ Ended','pending':'🟣 Pending'};
  let html='<div class="analysis-grid">';
  conflicts.forEach(conflict=>{
    const scores = calculateSideScores(conflict);
    const maxPct  = Math.max(...scores.map(s=>s.pct));
    const leader  = scores.find(s=>s.pct===maxPct);
    const margin  = maxPct - (scores.length>1 ? scores.filter(s=>s!==leader).reduce((m,s)=>Math.max(m,s.pct),0) : 0);
    let advantage = '⚖️ Balanced';
    if(margin>=20) advantage = `🔼 Strong lead: ${leader?.name}`;
    else if(margin>=8) advantage = `📈 Slight lead: ${leader?.name}`;

    const sidesRows = scores.map(s=>{
      const col = SIDE_COLORS[s.idx]||'#c8dde8';
      return `<div class="ac-side-row">
        <span class="ac-side-name" style="color:${col};">${esc(s.name)}</span>
        <div class="ac-side-bar-wrap"><div class="ac-side-bar" style="width:${s.pct}%;background:${col};"></div></div>
        <span class="ac-side-pct" style="color:${col};">${s.pct}%</span>
      </div>`;
    }).join('');

    html+=`<div class="analysis-card">
      <div class="ac-name">${esc(conflict.name)}</div>
      <div class="ac-status">${statusMap[conflict.status]||conflict.status} · ${(conflict.sides||[]).length} sides</div>
      <div class="ac-advantage">${advantage}</div>
      <div class="ac-sides-grid">${sidesRows}</div>
    </div>`;
  });
  html+='</div>';
  content.innerHTML=html;
  document.getElementById('analysis-modal').classList.add('open');
}
